name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (x64 Release)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & build
        run: dotnet build BlueScreenHelper/BlueScreenHelper.csproj -c Release

  package:
    name: Package installer (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained (win-x64)
        run: dotnet publish BlueScreenHelper/BlueScreenHelper.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: Bundle VC++ runtime libraries
        shell: pwsh
        run: |
          Copy-Item C:\Windows\System32\vcruntime140.dll, C:\Windows\System32\vcruntime140_1.dll, C:\Windows\System32\msvcp140.dll publish/win-x64/ -Force -ErrorAction SilentlyContinue
          Get-ChildItem publish/win-x64 -Filter 'vcruntime*'

      - name: Trim language folders & create log folder
        shell: pwsh
        run: |
          Get-ChildItem publish/win-x64 -Directory | Where-Object {
            $_.Name -notin @('zh-CN', 'en-us', 'Microsoft.UI.Xaml', 'runtimes', 'Assets')
          } | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force -Path publish/win-x64/log | Out-Null
          $readme = @(
            '此文件夹用于保存程序运行日志。',
            '遇到问题时，请将本文件夹（log）内的 .log 文件打包发给开发者，以便快速定位问题。',
            '若日志未出现在此处，请查看 %LOCALAPPDATA%\BlueScreenHelper\logs。'
          ) -join [Environment]::NewLine
          [System.IO.File]::WriteAllText("publish/win-x64/log/日志说明.txt", $readme, (New-Object System.Text.UTF8Encoding($false)))
          Get-ChildItem publish/win-x64 -Directory | Select-Object -ExpandProperty Name

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Patch version from git tag
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF -replace 'refs/tags/v', ''
          $verNoDash = ($ver -split '-')[0]

          $iss = Get-Content installer/installer.iss -Raw
          $iss = $iss -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$ver`""
          [System.IO.File]::WriteAllText("installer/installer.iss", $iss, (New-Object System.Text.UTF8Encoding($true)))

          $csproj = Get-Content BlueScreenHelper/BlueScreenHelper.csproj -Raw
          if ($csproj -match '<Version>[\s\S]*?</Version>') {
            $csproj = $csproj -replace '<Version>[\s\S]*?</Version>', "<Version>$verNoDash</Version>"
          } else {
            $csproj = $csproj -replace '<TargetFramework>[^<]*</TargetFramework>', "`$0`n    <Version>$verNoDash</Version>"
          }
          [System.IO.File]::WriteAllText("BlueScreenHelper/BlueScreenHelper.csproj", $csproj)

          $manifest = Get-Content BlueScreenHelper/app.manifest -Raw
          $manifest = $manifest -replace 'version="\d+\.\d+\.\d+(\.\d+)?"', "version=`"$verNoDash.0`""
          [System.IO.File]::WriteAllText("BlueScreenHelper/app.manifest", $manifest)

      - name: Compile installer with ISCC
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc installer/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC compile failed' }

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          overwrite: true